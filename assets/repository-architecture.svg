<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 140 1600 800" role="img" aria-labelledby="title description">
  <title id="title">contentsとprogramsの関係</title>
  <desc id="description">左側のprogramsにはプログラムごとの体験リンクだけがあり、右側のcontentsにある再利用可能な体験を参照する構造を示した図。1つの体験を複数のプログラムから参照でき、まだ参照されていない体験も保持できる。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0078d4"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c2d91"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: "Segoe UI", "Yu Gothic UI", sans-serif; fill: #1f1f1f; }
      .container-title { font-size: 26px; font-weight: 700; }
      .program-title { font-size: 24px; font-weight: 700; }
      .program-note { font-size: 18px; fill: #424242; }
      .pill-label { font-size: 19px; font-weight: 600; }
      .card-label { font-size: 20px; font-weight: 600; }
    </style>
  </defs>

  <rect y="140" width="1600" height="800" fill="#ffffff"/>

  <rect x="60" y="160" width="700" height="760" rx="18" fill="none" stroke="#0078d4" stroke-width="3"/>
  <text class="container-title" x="410" y="208" text-anchor="middle">programs/　進行の台本</text>

  <rect x="100" y="250" width="620" height="290" rx="14" fill="none" stroke="#0078d4" stroke-width="2"/>
  <text class="program-title" x="130" y="300">Copilot in 30</text>
  <text class="program-note" x="130" y="342">30日間の順番と</text>
  <text class="program-note" x="130" y="372">実施ルール</text>

  <rect x="390" y="302" width="290" height="56" rx="28" fill="#cfe4fa" stroke="#0078d4" stroke-width="2"/>
  <text class="pill-label" x="535" y="338" text-anchor="middle">CHAT-18 へのリンク</text>
  <rect x="390" y="387" width="290" height="56" rx="28" fill="#cfe4fa" stroke="#0078d4" stroke-width="2"/>
  <text class="pill-label" x="535" y="423" text-anchor="middle">MTG-01 へのリンク</text>
  <rect x="390" y="472" width="290" height="56" rx="28" fill="#cfe4fa" stroke="#0078d4" stroke-width="2"/>
  <text class="pill-label" x="535" y="508" text-anchor="middle">SETUP-01 へのリンク</text>

  <rect x="100" y="580" width="620" height="290" rx="14" fill="none" stroke="#5c2d91" stroke-width="2"/>
  <text class="program-title" x="130" y="630">SMB Guided</text>
  <text class="program-title" x="130" y="660">Experience</text>
  <text class="program-note" x="130" y="712">90分の順番と</text>
  <text class="program-note" x="130" y="742">実施ルール</text>

  <rect x="390" y="632" width="290" height="56" rx="28" fill="#e8daef" stroke="#5c2d91" stroke-width="2"/>
  <text class="pill-label" x="535" y="668" text-anchor="middle">SETUP-01 へのリンク</text>
  <rect x="390" y="717" width="290" height="56" rx="28" fill="#e8daef" stroke="#5c2d91" stroke-width="2"/>
  <text class="pill-label" x="535" y="753" text-anchor="middle">CHAT-01 へのリンク</text>
  <rect x="390" y="802" width="290" height="56" rx="28" fill="#e8daef" stroke="#5c2d91" stroke-width="2"/>
  <text class="pill-label" x="535" y="838" text-anchor="middle">AGB-02 へのリンク</text>

  <rect x="920" y="160" width="620" height="760" rx="18" fill="none" stroke="#0c8599" stroke-width="3"/>
  <text class="container-title" x="1230" y="208" text-anchor="middle">contents/　再利用できる体験</text>

  <line x1="680" y1="330" x2="950" y2="330" stroke="#0078d4" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="680" y1="415" x2="950" y2="415" stroke="#0078d4" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M 680 500 C 810 500, 820 660, 950 660" fill="none" stroke="#0078d4" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="680" y1="660" x2="950" y2="660" stroke="#5c2d91" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <line x1="680" y1="745" x2="950" y2="745" stroke="#5c2d91" stroke-width="3" marker-end="url(#arrow-purple)"/>
  <line x1="680" y1="830" x2="950" y2="830" stroke="#5c2d91" stroke-width="3" marker-end="url(#arrow-purple)"/>

  <g filter="url(#shadow)">
    <rect x="960" y="290" width="540" height="80" rx="8" fill="#ccf3f7" stroke="#0c8599" stroke-width="2"/>
    <rect x="960" y="375" width="540" height="80" rx="8" fill="#ccf3f7" stroke="#0c8599" stroke-width="2"/>
    <rect x="960" y="460" width="540" height="80" rx="8" fill="#f3f2f1" stroke="#797775" stroke-width="2" stroke-dasharray="9 7"/>
    <rect x="960" y="620" width="540" height="80" rx="8" fill="#ccf3f7" stroke="#0c8599" stroke-width="2"/>
    <rect x="960" y="705" width="540" height="80" rx="8" fill="#ccf3f7" stroke="#0c8599" stroke-width="2"/>
    <rect x="960" y="790" width="540" height="80" rx="8" fill="#ccf3f7" stroke="#0c8599" stroke-width="2"/>
  </g>
  <text class="card-label" x="1230" y="338" text-anchor="middle">CHAT-18｜既存資料を要約する</text>
  <text class="card-label" x="1230" y="423" text-anchor="middle">MTG-01｜会議を要約しフォローアップする</text>
  <text class="card-label" x="1230" y="495" text-anchor="middle">SETUP-02｜日本のCXO向けデモ環境を構築</text>
  <text x="1230" y="523" text-anchor="middle" font-size="16" fill="#605e5c">プログラムから未参照</text>
  <text class="card-label" x="1230" y="668" text-anchor="middle">SETUP-01｜サインインと安全なAI利用</text>
  <text class="card-label" x="1230" y="753" text-anchor="middle">CHAT-01｜競合3社を比較する</text>
  <text class="card-label" x="1230" y="838" text-anchor="middle">AGB-02｜軽量Agent Builder体験</text>

  <text x="1230" y="890" text-anchor="middle" font-size="17" fill="#424242">1体験1ファイル。複数のプログラムから参照できます</text>
</svg>